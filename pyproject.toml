[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-core"
version = "0.1.0.dev0"
description = "Self-hosted, messenger-first work dispatch and proof-of-work core"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]
dev = [
    "coverage[toml]>=7.6,<8",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
dispatch-core = "dispatch_core.__main__:main"
dispatch-core-api = "dispatch_core.runtime.api:main"
dispatch-core-worker = "dispatch_core.runtime.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires a live PostgreSQL database",
    "transport: transport contract test",
]

[tool.coverage.run]
branch = true
source = ["dispatch_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
